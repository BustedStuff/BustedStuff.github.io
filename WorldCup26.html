  correctDrawExact: 10,   // correct draw outcome AND exact score
};

// ─── Stage multipliers ────────────────────────────────────────────────────────
const STAGE_MULTIPLIERS = {
  group:       5,
  roundOf32:   6,
  roundOf16:   7,
  quarterFinal:8,
  semiFinal:   9,
  thirdPlace:  9,
  final:       10,
};

// Map the raw group/stage string from the API (or sample data) to a multiplier key
function stageMultiplier(group) {
  if (!group) return STAGE_MULTIPLIERS.group;
  const g = group.toUpperCase();
  if (g.includes("FINAL") && !g.includes("SEMI") && !g.includes("QUARTER") && !g.includes("THIRD")) return STAGE_MULTIPLIERS.final;
  if (g.includes("THIRD") || g.includes("3RD") || g.includes("THIRD PLACE")) return STAGE_MULTIPLIERS.thirdPlace;
  if (g.includes("SEMI")) return STAGE_MULTIPLIERS.semiFinal;
  if (g.includes("QUARTER")) return STAGE_MULTIPLIERS.quarterFinal;
  if (g.includes("ROUND OF 16") || g.includes("LAST 16") || g.includes("R16")) return STAGE_MULTIPLIERS.roundOf16;
  if (g.includes("ROUND OF 32") || g.includes("LAST 32") || g.includes("R32")) return STAGE_MULTIPLIERS.roundOf32;
  // Default: anything with "GROUP" or a letter group label (e.g. "Group A")
  return STAGE_MULTIPLIERS.group;
}

function getFlagEmoji(code) {
  if (!code) return "🏳";
  const codePoints = [...code.toUpperCase()].map(c => 0x1F1E0 - 65 + c.charCodeAt(0));
  return String.fromCodePoint(...codePoints);
}

function teamFlag(name) {
  if (!name || name === "TBD") return "🏳";
  // 1. Exact match
  if (FLAGS[name]) return getFlagEmoji(FLAGS[name]);
  // 2. Partial match (handles "Korea Republic" matching "South Korea" etc.)
  for (const [k, v] of Object.entries(FLAGS)) {
    if (name.includes(k) || k.includes(name)) return getFlagEmoji(v);
  }
  return "🏳";
}

function calcPts(pick, result, group) {
  // No result yet or no pick submitted → 0
  if (!result || result.homeScore == null || result.homeScore === "") return 0;
  if (!pick || pick.homeScore == null || pick.homeScore === "") return SCORING.wrongOrMissed;

  const rH = parseInt(result.homeScore), rA = parseInt(result.awayScore);
  const pH = parseInt(pick.homeScore),   pA = parseInt(pick.awayScore);

  const resultIsDraw = rH === rA;
  const pickIsDraw   = pH === pA;
  const resultHomeWin = rH > rA;
  const pickHomeWin   = pH > pA;

  // Did they pick the correct outcome (who wins / draw)?
  const correctOutcome =
    (resultIsDraw && pickIsDraw) ||
    (resultHomeWin && pickHomeWin) ||
    (!resultIsDraw && !resultHomeWin && !pickIsDraw && !pickHomeWin);

  if (!correctOutcome) return SCORING.wrongOrMissed;

  // ── Draw branch ───────────────────────────────────────────────────────────
  if (resultIsDraw) {
    const base = (pH === rH && pA === rA) ? SCORING.correctDrawExact : SCORING.correctDrawOnly;
    return base * stageMultiplier(group);
  }

  // ── Win/Loss branch ───────────────────────────────────────────────────────
  const winnerGoals = resultHomeWin ? rH : rA;
  const loserGoals  = resultHomeWin ? rA : rH;
  const pickedWinnerGoals = pickHomeWin ? pH : pA;
  const pickedLoserGoals  = pickHomeWin ? pA : pH;

  const gotWinnerGoals = pickedWinnerGoals === winnerGoals;
  const gotLoserGoals  = pickedLoserGoals  === loserGoals;

  let base;
  if (gotWinnerGoals) base = SCORING.correctWinnerWinner;
  else if (gotLoserGoals) base = SCORING.correctWinnerLoser;
  else base = SCORING.correctWinner;

  return base * stageMultiplier(group);
}

function isLocked(iso) {
  if (!iso) return false;
  return new Date() >= new Date(new Date(iso).getTime() - 60000);
}

function countdown(iso) {
  if (!iso) return null;
  const diff = new Date(new Date(iso).getTime() - 60000) - new Date();
  if (diff <= 0) return null;
  const h=Math.floor(diff/3600000), m=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
  if (h>48) return Math.floor(h/24)+"d "+h%24+"h";
  if (h>0) return h+"h "+m+"m";
  if (m>0) return m+"m "+s+"s";
  return s+"s";
}

async function loadFixtures(key) {
  const r = await fetch("https://api.football-data.org/v4/competitions/WC/matches?season=2026", {
    headers: { "X-Auth-Token": key }
  });
  if (!r.ok) throw new Error("football-data.org error " + r.status);
  const d = await r.json();
  return (d.matches || []).map((m, i) => ({
    id: String(m.id || i),
    date: (m.utcDate || "").split("T")[0],
    kickoffISO: m.utcDate || "",
    time: m.utcDate ? new Date(m.utcDate).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",timeZone:"America/New_York"}) : "",
    home: m.homeTeam?.shortName || m.homeTeam?.name || "TBD",
    away: m.awayTeam?.shortName || m.awayTeam?.name || "TBD",
    homeFlag: teamFlag(m.homeTeam?.name),
    awayFlag: teamFlag(m.awayTeam?.name),
    venue: m.venue || "TBD",
    group: m.group || m.stage || "Group Stage",
    status: m.status || "TIMED",
  }));
}


async function loadWeather(venue, iso) {
  const c = VENUE_COORDS[venue];
  if (!c || !iso) return null;
  const date = iso.split("T")[0];
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude="+c.lat+"&longitude="+c.lon+
      "&hourly=temperature_2m,weathercode,windspeed_10m,precipitation_probability"+
      "&timezone="+encodeURIComponent(c.tz)+"&start_date="+date+"&end_date="+date;
    const r = await fetch(url);
    const d = await r.json();
    const lh = parseInt(new Date(iso).toLocaleString("en-US",{timeZone:c.tz,hour:"2-digit",hour12:false})) || 12;
    const idx = Math.min(lh, (d.hourly?.time?.length || 1) - 1);
    const tc = d.hourly?.temperature_2m?.[idx];
    return {
      temp: tc != null ? Math.round(tc * 9/5 + 32) : null,
      code: d.hourly?.weathercode?.[idx],
      wind: Math.round((d.hourly?.windspeed_10m?.[idx] || 0) * 0.621),
      precip: d.hourly?.precipitation_probability?.[idx] || 0,
    };
  } catch { return null; }
}

function Countdown({ iso, lang }) {
  const t = STRINGS[lang];
  const [tl, setTl] = useState(countdown(iso));
  useEffect(() => {
    const timer = setInterval(() => setTl(countdown(iso)), 1000);
    return () => clearInterval(timer);
  }, [iso]);
  if (!tl) return null;
  const urgent = !tl.includes("d") && !tl.includes("h");
  return (
    <span style={{background:urgent?C.redDark:C.dimmer,border:"1px solid "+(urgent?C.red:C.navyBorder),borderRadius:4,padding:"2px 8px",color:urgent?"#ffaaaa":C.gold,fontSize:"0.7rem",fontFamily:"monospace",fontWeight:700,animation:urgent?"pulse 1s infinite":"none"}}>
      {tl} {t.toLock}
    </span>
  );
}

  const fm = matches.filter(m => {
    if (filter==="all") return true;
    if (filter==="upcoming") return !results[m.id] && !isLocked(m.kickoffISO);
    if (filter==="locked") return isLocked(m.kickoffISO) && !results[m.id];
    return !!results[m.id];
  });
  const right = (
    <div style={{display:"flex",alignItems:"center",gap:12}}>
      <div style={{textAlign:"right"}}>
        <div style={{color:C.gold,fontWeight:700,fontFamily:"monospace",fontSize:"1.05rem"}}>{totalPts} {t.pts}</div>
        <div style={{color:C.dim,fontSize:"0.67rem"}}>{t.rank} #{rank} / {board.length}</div>
      </div>
      <button className="btn" onClick={onLogout} style={{background:"transparent",border:"1px solid "+C.dimmer,color:C.dim,borderRadius:6,padding:"5px 12px",fontSize:"0.75rem"}}>{t.logout}</button>
    </div>
  );
  return (
    <div style={{minHeight:"100vh",background:"radial-gradient(ellipse at 50% 0%, #142e5e 0%, "+C.navy+" 40%, "+C.navyDeep+" 100%)",fontFamily:"Inter,sans-serif",paddingBottom:60,position:"relative"}}>
      <style>{CSS}</style>
      <PitchBg />
      <div style={{position:"fixed",top:0,left:0,right:0,height:3,background:"linear-gradient(90deg,"+C.red+","+C.sky+","+C.gold+")",zIndex:30}} />
      <TopBar right={right} lang={lang} setLang={setLang} />
      <div style={{maxWidth:720,margin:"0 auto",padding:"20px 12px",position:"relative",zIndex:1}}>
        <Tabs tabs={[["picks",t.myPicks],["leaderboard",t.leaderboard]]} active={tab} onChange={setTab} />
        {tab==="picks" && (
          <>
            <Filters filters={[["upcoming",t.open],["locked",t.locked],["completed",t.final],["all",t.all]]} active={filter} onChange={setFilter} />
            {fm.length===0 && <p style={{color:C.dim,fontStyle:"italic"}}>{t.noMatches}</p>}
            {fm.map(m => <MatchCard key={m.id} match={m} pick={myPicks[m.id]} onPick={onSavePick} result={results[m.id]} w={weather[m.id]} lang={lang} />)}
          </>
        )}
        {tab==="leaderboard" && (
          <>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"2rem",color:C.white,letterSpacing:4,marginBottom:20}}>{t.standings}</div>
            {board.length===0 && <p style={{color:C.dim}}>{t.noPicks}</p>}
            {board.map((e,i) => (
              <div key={e.tm} style={{background:e.tm===teamName?"linear-gradient(135deg,#142e14,"+C.navyCard+")":"linear-gradient(135deg,"+C.navyMid+","+C.navyCard+")",border:"1px solid "+(e.tm===teamName?"#2a4a2a":C.navyBorder),borderRadius:10,padding:"13px 18px",marginBottom:7,display:"flex",alignItems:"center",gap:14,position:"relative",overflow:"hidden"}}>
                {e.tm===teamName && <div style={{position:"absolute",left:0,top:0,bottom:0,width:3,background:"linear-gradient("+C.gold+",#5de890)"}} />}
                <span style={{fontSize:"0.95rem",width:32,textAlign:"center",color:i===0?C.gold:i===1?"#bbb":i===2?"#cd7f32":C.dim,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700}}>{i===0?"1°":i===1?"2°":i===2?"3°":"#"+(i+1)}</span>
                <div style={{flex:1}}>
                  <div style={{color:C.offWhite,fontWeight:600,fontSize:"0.9rem"}}>{e.tm}
                    {e.tm===teamName && <span style={{color:"#5de890",fontSize:"0.67rem",marginLeft:6,background:"#0e2a14",padding:"1px 6px",borderRadius:3}}>{t.you}</span>}
                  </div>
                  <div style={{color:C.dim,fontSize:"0.7rem"}}>{e.n} {t.picks}</div>
                </div>
                <div style={{fontFamily:"monospace",fontSize:"1.15rem",fontWeight:700,color:C.gold}}>{e.pts} {t.pts}</div>
              </div>
            ))}
          </>
        )}
      </div>
    </div>
  );
}

function AdminView({ matches, results, allPicks, weather, onSaveResult, onLogout, onRefresh, onConfigApis, loading, dataError, lang, setLang }) {
  const t = STRINGS[lang];
  const [tab, setTab] = useState("results");
  const [edits, setEdits] = useState({});
  const matchById = Object.fromEntries(matches.map(m => [m.id, m]));
  const board = Object.entries(allPicks).map(([tm,picks]) => ({
    tm, pts:Object.entries(picks).reduce((s,[mid,p])=>s+calcPts(p,results[mid],matchById[mid]?.group),0), n:Object.keys(picks).length, picks
  })).sort((a,b)=>b.pts-a.pts);
  const right = (
    <div style={{display:"flex",gap:7}}>
      <button className="btn" onClick={onRefresh} disabled={loading} style={{background:C.dimmer,color:C.gold,border:"1px solid "+C.navyBorder,borderRadius:6,padding:"5px 12px",fontSize:"0.75rem",fontWeight:600,opacity:loading?.5:1}}>
        <span style={{display:"inline-block",animation:loading?"spin 1s linear infinite":"none"}}>↻</span> {loading?t.loading:t.refresh}
      </button>
      <button className="btn" onClick={onConfigApis} style={{background:"transparent",border:"1px solid "+C.dimmer,color:C.dim,borderRadius:6,padding:"5px 12px",fontSize:"0.75rem"}}>{t.apis}</button>
      <button className="btn" onClick={onLogout} style={{background:"transparent",border:"1px solid "+C.dimmer,color:C.dim,borderRadius:6,padding:"5px 12px",fontSize:"0.75rem"}}>{t.logout}</button>
    </div>
  );
  return (
    <div style={{minHeight:"100vh",background:"radial-gradient(ellipse at 50% 0%, #142e5e 0%, "+C.navy+" 40%, "+C.navyDeep+" 100%)",fontFamily:"Inter,sans-serif",paddingBottom:60,position:"relative"}}>
      <style>{CSS}</style>
      <PitchBg />
      <div style={{position:"fixed",top:0,left:0,right:0,height:3,background:"linear-gradient(90deg,"+C.red+","+C.sky+","+C.gold+")",zIndex:30}} />
      <TopBar tag={t.commissioner} right={right} lang={lang} setLang={setLang} />
      {dataError && <div style={{background:"#1a0812",border:"1px solid "+C.red+"44",borderRadius:8,margin:"12px 16px 0",padding:"8px 14px",color:"#ff9090",fontSize:"0.78rem",position:"relative",zIndex:1}}>{dataError}</div>}
      <div style={{maxWidth:900,margin:"0 auto",padding:"20px 12px",position:"relative",zIndex:1}}>
        <Tabs tabs={[["results",t.results],["picks",t.allPicks],["leaderboard",t.leaderboard]]} active={tab} onChange={setTab} />
        {tab==="results" && (
          <>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"2rem",color:C.white,letterSpacing:4,marginBottom:20}}>{t.matchResults}</div>
            {matches.map(m => {
              const sv = results[m.id];
              const ed = edits[m.id] ?? {homeScore:sv?.homeScore??"",awayScore:sv?.awayScore??""};
              return (
                <div key={m.id} style={{background:"linear-gradient(155deg,"+C.navyMid+","+C.navyCard+")",border:"1px solid "+C.navyBorder,borderRadius:12,padding:"15px 18px",marginBottom:9}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
                    <div>
                      <div style={{color:C.red,fontSize:"0.67rem",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",fontFamily:"'Barlow Condensed',sans-serif",marginBottom:3}}>{m.group} · {m.date}</div>
                      <div style={{color:C.offWhite,fontWeight:600,fontSize:"0.92rem"}}>{m.homeFlag} {m.home} vs {m.away} {m.awayFlag}</div>
                      <div style={{display:"flex",gap:6,marginTop:7,flexWrap:"wrap"}}>
                        {weather[m.id] && <WeatherBadge w={weather[m.id]} lang={lang} />}
                      </div>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
                      <input type="number" min={0} max={20} value={ed.homeScore} onChange={e=>setEdits(p=>({...p,[m.id]:{...ed,homeScore:e.target.value}}))}
                        style={{width:48,background:C.navyDeep,border:"1px solid "+C.navyBorder,borderRadius:6,padding:"7px 0",color:C.gold,fontSize:"1.15rem",fontWeight:700,textAlign:"center",fontFamily:"monospace"}} />
                      <span style={{color:C.dim}}>-</span>
                      <input type="number" min={0} max={20} value={ed.awayScore} onChange={e=>setEdits(p=>({...p,[m.id]:{...ed,awayScore:e.target.value}}))}
                        style={{width:48,background:C.navyDeep,border:"1px solid "+C.navyBorder,borderRadius:6,padding:"7px 0",color:C.gold,fontSize:"1.15rem",fontWeight:700,textAlign:"center",fontFamily:"monospace"}} />
                      <button className="btn" onClick={()=>onSaveResult(m.id,ed)} style={{background:"linear-gradient(135deg,"+C.red+","+C.redDark+")",color:C.white,border:"none",borderRadius:6,padding:"7px 14px",fontSize:"0.8rem",fontWeight:700,boxShadow:"0 2px 10px "+C.redGlow}}>
                        {sv ? t.update : t.save}
                      </button>
                      {sv && <span style={{color:"#5de890",fontSize:"0.75rem"}}>{sv.homeScore}-{sv.awayScore}</span>}
                    </div>
                  </div>
                </div>
              );
            })}
          </>
        )}
        {tab==="picks" && (
          <>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"2rem",color:C.white,letterSpacing:4,marginBottom:20}}>{t.allPicksTitle}</div>
            {board.length===0 && <p style={{color:C.dim}}>{t.noPicks}</p>}
            {board.map(entry => (
              <div key={entry.tm} style={{background:"linear-gradient(155deg,"+C.navyMid+","+C.navyCard+")",border:"1px solid "+C.navyBorder,borderRadius:12,padding:16,marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
                  <span style={{color:C.offWhite,fontWeight:600,fontSize:"0.9rem"}}>{entry.tm}</span>
                  <span style={{color:C.gold,fontFamily:"monospace",fontWeight:700,fontSize:"0.88rem"}}>{entry.pts} {t.pts} · {entry.n} {t.picks}</span>
                </div>
                {matches.map(m => {
                  const p=entry.picks[m.id], r=results[m.id], pts=p&&r?calcPts(p,r,m.group):null;
                  return (
                    <div key={m.id} style={{display:"flex",justifyContent:"space-between",borderBottom:"1px solid "+C.dimmer,padding:"4px 0"}}>
                      <span style={{color:C.dim,fontSize:"0.77rem"}}>{m.homeFlag} {m.home} vs {m.away} {m.awayFlag}</span>
                      {p ? <div style={{display:"flex",gap:7,alignItems:"center"}}>
                        <span style={{color:C.muted,fontFamily:"monospace",fontSize:"0.82rem"}}>{p.homeScore}-{p.awayScore}</span>
                        {pts!==null && <PtsBadge pts={pts} />}
                      </div> : <span style={{color:C.dimmer,fontSize:"0.77rem"}}>-</span>}
                    </div>
                  );
                })}
              </div>
            ))}
          </>
        )}
        {tab==="leaderboard" && (
          <>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"2rem",color:C.white,letterSpacing:4,marginBottom:20}}>{t.leaderboardTitle}</div>
            {board.map((e,i) => (
              <div key={e.tm} style={{background:"linear-gradient(135deg,"+C.navyMid+","+C.navyCard+")",border:"1px solid "+C.navyBorder,borderRadius:10,padding:"13px 18px",marginBottom:7,display:"flex",alignItems:"center",gap:14}}>
                <span style={{color:i===0?C.gold:i===1?"#bbb":i===2?"#cd7f32":C.dim,fontSize:"0.95rem",width:32,textAlign:"center",fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700}}>{i===0?"1°":i===1?"2°":i===2?"3°":"#"+(i+1)}</span>
                <div style={{flex:1}}>
                  <div style={{color:C.offWhite,fontWeight:600,fontSize:"0.9rem"}}>{e.tm}</div>
                  <div style={{color:C.dim,fontSize:"0.7rem"}}>{e.n} {t.picks}</div>
                </div>
                <div style={{fontFamily:"monospace",fontSize:"1.15rem",fontWeight:700,color:C.gold}}>{e.pts} {t.pts}</div>
              </div>
            ))}
          </>
        )}
      </div>
    </div>
  );
}

function App() {
  const [view,setView] = useState("entry");
  const [teamName,setTeamName] = useState("");
  const [matches,setMatches] = useState([]);
  const [results,setResults] = useState({});
  const [allPicks,setAllPicks] = useState({});
  const [weather,setWeather] = useState({});
  const [apiKeys,setApiKeys] = useState(null);
  const [showApiConfig,setShowApiConfig] = useState(false);
  const [loading,setLoading] = useState(true);
  const [dataLoading,setDataLoading] = useState(false);
  const [dataError,setDataError] = useState("");
  const [lang,setLang] = useState("en");

  useEffect(() => {
    (async () => {
      const [r,p,w,k,m,l] = await Promise.all([
        store.get("wc-results"), store.get("wc-picks"), store.get("wc-weather"),
        store.get("wc-apikeys"), store.get("wc-matches"),
        store.get("wc-lang"),
      ]);
      if (r) setResults(r);
      if (p) setAllPicks(p);
      if (w) setWeather(w);
      if (k) setApiKeys(k);
      if (l) setLang(l);
      setMatches(m || SAMPLE);
      setLoading(false);
    })();
  }, []);

  const handleSetLang = (l) => { setLang(l); store.set("wc-lang", l); };

  const loadLiveData = useCallback(async (keys) => {
    if (!keys?.footballDataKey) { setMatches(SAMPLE); return; }
    setDataLoading(true); setDataError("");
    try {
      let fm = SAMPLE;
      try { fm = await loadFixtures(keys.footballDataKey); }
      catch (e) { setDataError(STRINGS[lang].fixturesError + e.message + STRINGS[lang].usingSample); fm = SAMPLE; }
      setMatches(fm); store.set("wc-matches", fm);
      const wm = {};
      for (const m of fm.filter(m=>!isLocked(m.kickoffISO)).slice(0,10)) {
        const w = await loadWeather(m.venue, m.kickoffISO);
        if (w) wm[m.id] = w;
        await new Promise(r=>setTimeout(r,150));
      }
      setWeather(wm); store.set("wc-weather", wm);
    } catch (e) { setDataError(String(e)); }
    setDataLoading(false);
  }, [lang]);

  const handleApiSave = async (keys) => {
    setApiKeys(keys);
    if (keys) store.set("wc-apikeys", keys);
    setShowApiConfig(false);
    await loadLiveData(keys);
  };

  const handleSavePick = useCallback(async (mid, pick) => {
    setAllPicks(prev => {
      const u = {...prev, [teamName]: {...(prev[teamName]||{}), [mid]: pick}};
      store.set("wc-picks", u);
      return u;
    });
  }, [teamName]);

  const handleSaveResult = useCallback(async (mid, result) => {
    setResults(prev => {
      const u = {...prev, [mid]: result};
      store.set("wc-results", u);
      return u;
    });
  }, []);

  if (loading) return (
    <div style={{minHeight:"100vh",background:C.navyDeep,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <style>{CSS}</style>
      <span style={{color:C.gold,fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.4rem",letterSpacing:4}}>{STRINGS[lang].loading.toUpperCase()}</span>
    </div>
  );

  if (showApiConfig) return (
    <div style={{minHeight:"100vh",background:"radial-gradient(ellipse at 30% 0%, #142e5e, "+C.navyDeep+")",display:"flex",alignItems:"center",justifyContent:"center",padding:24,position:"relative"}}>
      <style>{CSS}</style>
      <PitchBg />
      <div style={{position:"fixed",top:14,right:18,zIndex:30}}><LangSwitch lang={lang} setLang={handleSetLang} /></div>
      <div style={{width:"100%",maxWidth:500,position:"relative",zIndex:1}}>
        <ApiConfig onSave={handleApiSave} existing={apiKeys} lang={lang} />
      </div>
    </div>
  );

  if (view==="entry") return <EntryScreen onEnter={n=>{setTeamName(n);setView("participant");}} onAdmin={()=>setView("admin")} lang={lang} setLang={handleSetLang} />;
  if (view==="admin") return <AdminView matches={matches} results={results} allPicks={allPicks} weather={weather} onSaveResult={handleSaveResult} onLogout={()=>setView("entry")} onRefresh={()=>loadLiveData(apiKeys)} onConfigApis={()=>setShowApiConfig(true)} loading={dataLoading} dataError={dataError} lang={lang} setLang={handleSetLang} />;
  return <ParticipantView teamName={teamName} matches={matches} results={results} allPicks={allPicks} weather={weather} onSavePick={handleSavePick} onLogout={()=>{setTeamName("");setView("entry");}} lang={lang} setLang={handleSetLang} />;
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
