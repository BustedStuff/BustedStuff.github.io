<!DOCTYPE html>

<title>World Cup Pick'em 2026</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060E1F;font-family:'Inter',sans-serif;color:#fff;min-height:100vh}
input{outline:none;font-family:'Inter',sans-serif}
input:focus{border-color:#F0A500!important;box-shadow:0 0 0 2px #F0A50033!important}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
button{cursor:pointer;font-family:'Barlow Condensed',sans-serif;transition:all .18s}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
button:active{transform:translateY(0)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#060E1F}::-webkit-scrollbar-thumb{background:#1E3354;border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.fade{animation:fadeUp .4s ease both}
.pitch{position:fixed;inset:0;pointer-events:none;opacity:.04;z-index:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 119px,#fff 119px,#fff 120px),repeating-linear-gradient(90deg,transparent,transparent 119px,#fff 119px,#fff 120px)}
.topbar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#C8102E,#1D70B8,#F0A500);z-index:100}
.botbar{position:fixed;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#C8102E,#1D70B8,#F0A500);z-index:100}
.card{background:linear-gradient(145deg,#0F2847,#0D2040);border:1px solid #1A3560;border-radius:12px;padding:18px 20px;margin-bottom:10px;position:relative;overflow:hidden}
.card-top{position:absolute;top:0;left:0;right:0;height:2px}
.nav{background:#060E1F;border-bottom:1px solid #1A3560;padding:13px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;gap:10px;flex-wrap:wrap}
.nav-title{font-family:'Bebas Neue',sans-serif;letter-spacing:4px;font-size:1.3rem}
.tab-btn{border:none;border-radius:7px;padding:6px 16px;font-size:.8rem;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.tab-btn.active{background:linear-gradient(135deg,#C8102E,#9A0C23);color:#fff;box-shadow:0 2px 12px #C8102E44}
.tab-btn.inactive{background:transparent;color:#3A5A80;border:1px solid #1E3354}
.filter-btn{border-radius:6px;padding:4px 12px;font-size:.73rem;font-weight:600;border:1px solid}
.filter-btn.active{background:#1E3354;color:#F0A500;border-color:#1A3560}
.filter-btn.inactive{background:transparent;color:#3A5A80;border-color:#1E3354}
.week-nav{position:sticky;top:56px;z-index:40;background:#060E1Fdd;backdrop-filter:blur(8px);padding:8px 0 8px;margin-bottom:16px;border-bottom:1px solid #1A356044}
.week-pill{border:1px solid #1A3560;border-radius:20px;padding:5px 14px;font-size:.72rem;font-weight:700;white-space:nowrap;font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;transition:all .18s;cursor:pointer}
.week-pill.active{background:#C8102E;color:#fff;border-color:#C8102E;box-shadow:0 2px 10px #C8102E44}
.week-pill.inactive{background:transparent;color:#3A5A80}
.week-pill:hover{color:#E8EDF5;border-color:#3A5A80}
.week-scroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scroll-behavior:smooth}
.week-scroll::-webkit-scrollbar{height:3px}
.week-scroll::-webkit-scrollbar-track{background:transparent}
.week-scroll::-webkit-scrollbar-thumb{background:#1E3354;border-radius:3px}
.week-header{display:flex;align-items:center;gap:12px;margin:24px 0 12px}
.week-header-line{flex:1;height:1px;background:linear-gradient(90deg,#1A3560,transparent)}
.week-header-text{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:3px;color:#F0A500;white-space:nowrap}
.red-btn{background:linear-gradient(135deg,#C8102E,#9A0C23);color:#fff;border:none;border-radius:8px;padding:13px;font-size:1rem;font-weight:700;letter-spacing:1.5px;width:100%;box-shadow:0 4px 20px #C8102E44}
.gold-btn{background:linear-gradient(135deg,#F0A500,#FFD04A);color:#060E1F;border:none;border-radius:8px;padding:13px;font-size:1rem;font-weight:700;letter-spacing:1.5px;width:100%}
.ghost-btn{background:transparent;border:1px solid #1E3354;color:#3A5A80;border-radius:8px;padding:9px;width:100%;font-size:.82rem}
.inp{background:#060E1F;border:1px solid #1A3560;border-radius:8px;padding:12px 14px;color:#fff;font-size:.95rem;width:100%}
.score-inp{width:48px;background:#060E1F;border:1px solid #1A3560;border-radius:6px;padding:7px 0;color:#F0A500;font-size:1.25rem;font-weight:700;text-align:center;font-family:monospace}
.lock-btn{border:none;border-radius:6px;padding:7px 13px;font-size:.78rem;font-weight:700;white-space:nowrap}
.weather-badge{display:inline-flex;align-items:center;gap:5px;background:#1E3354;border:1px solid #1A3560;border-radius:6px;padding:4px 10px;font-size:.74rem}
.pts-badge{border-radius:4px;padding:2px 8px;font-weight:700;font-size:.75rem;font-family:monospace}
.lang-sw{display:flex;align-items:center;gap:4px;background:#1E3354;border:1px solid #1A3560;border-radius:20px;padding:3px;cursor:pointer}
.lang-opt{padding:4px 10px;border-radius:16px;font-size:.73rem;font-weight:700;display:flex;align-items:center;gap:4px;transition:all .18s;font-family:'Barlow Condensed',sans-serif}
.lang-opt.on{background:#C8102E;color:#fff}
.lang-opt.off{color:#3A5A80}
.err{color:#ff7070;font-size:.82rem;background:#2a080a;border:1px solid #4a1018;border-radius:6px;padding:7px 12px;margin-bottom:12px}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:4px;margin-bottom:20px}
#app{position:relative;z-index:1}
</style>
</head>

  en:{appTitle:"WC PICK'EM",appYear:"2026",worldCup:"WORLD CUP",pickem:"PICK'EM 2026",tagline:"Real-time weather · Picks lock 1 min before kickoff",teamNameLabel:"Your Team Name",teamNamePh:"e.g. The Offside Trappers",passLabel:"League Passcode",passPh:"Enter passcode",joinBtn:"JOIN LEAGUE",commAccess:"Commissioner Access",adminPh:"Admin passcode",enterAdmin:"ENTER ADMIN",score0:"Wrong pick / No submission",score3:"Correct winning team",score4:"Correct winner + losing team goals",score6win:"Correct winner + winning team goals",score6draw:"Correct draw (wrong score)",score10:"Correct draw + exact score",mulTitle:"Stage Multipliers",mulGroup:"Group Stage",mulR32:"Round of 32",mulR16:"Round of 16",mulQF:"Quarter Finals",mulSF:"Semi Finals / 3rd Place",mulF:"Final",pts:"pts",myPicks:"My Picks",leaderboard:"Leaderboard",standings:"STANDINGS",open:"Open",locked:"Locked",final:"Final",all:"All",yourPick:"Your Pick",lockIn:"Lock In",update:"Update",saved:"Saved!",noPick:"No pick",picksLocked:"Picks locked",toLock:"to lock",rank:"Rank",picks:"picks",noPicks:"No picks yet.",noMatches:"No matches here.",logout:"Logout",you:"you",results:"Results",allPicks:"All Picks",matchResults:"MATCH RESULTS",allPicksTitle:"ALL PICKS",leaderboardTitle:"LEADERBOARD",save:"Save",refresh:"Refresh",loading:"Loading",apis:"APIs",commissioner:"COMMISSIONER",apiConfig:"API CONFIGURATION",apiTagline:"Fixtures load automatically via proxy.",fdLabel:"football-data.org Key (optional - pre-configured)",weatherNote:"Open-Meteo weather — no key needed, always on",saveLoad:"REFRESH LIVE DATA",skipSample:"Use sample data",incorrectPass:"Incorrect passcode.",enterTeam:"Enter a team name.",wrongAdmin:"Wrong admin code.",vs:"VS",wind:"mph wind"},

};

  {id:"s6",date:"2026-06-14",kickoffISO:"2026-06-14T22:00:00Z",time:"6:00 PM",home:"England",away:"Tunisia",homeCode:"gb-eng",awayCode:"tn",venue:"AT&T Stadium",group:"Group G",status:"TIMED"},

];

// ── Helpers ──────────────────────────────────────────────────────────────────
function norm(s){try{return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}catch{return s.toLowerCase()}}
function teamCode(name){
  if(!name||name==="TBD")return null;
  if(FLAG_CODES[name])return FLAG_CODES[name];
  const n=norm(name);
  for(const[k,v]of Object.entries(FLAG_CODES)){if(norm(k)===n||n.includes(norm(k))||norm(k).includes(n))return v;}
  return null;
}
function flagImg(code,sm){
  if(!code)return "";
  const sz=sm?20:28,h=Math.round(sz*0.75);
  return `<img src="https://flagcdn.com/${sz}x${h}/${code}.png" style="width:${sz}px;height:${h}px;border-radius:2px;object-fit:cover;vertical-align:middle" onerror="this.style.display='none'">`;
}
function stageMul(group){
  if(!group)return STAGE_MUL.group;
  const g=group.toUpperCase();
  if(g.includes("FINAL")&&!g.includes("SEMI")&&!g.includes("QUARTER")&&!g.includes("THIRD"))return STAGE_MUL.final;
  if(g.includes("THIRD")||g.includes("3RD"))return STAGE_MUL.thirdPlace;
  if(g.includes("SEMI"))return STAGE_MUL.semiFinal;
  if(g.includes("QUARTER"))return STAGE_MUL.quarterFinal;
  if(g.includes("ROUND OF 16")||g.includes("LAST 16"))return STAGE_MUL.roundOf16;
  if(g.includes("ROUND OF 32")||g.includes("LAST 32"))return STAGE_MUL.roundOf32;
  return STAGE_MUL.group;
}
function calcPts(pick,result,group){
  if(!result||result.homeScore==null||result.homeScore==="")return 0;
  if(!pick||pick.homeScore==null||pick.homeScore==="")return 0;
  const rH=+result.homeScore,rA=+result.awayScore,pH=+pick.homeScore,pA=+pick.awayScore;
  const rTie=rH===rA,pTie=pH===pA,rHW=rH>rA,pHW=pH>pA;
  const ok=(rTie&&pTie)||(rHW&&pHW)||(!rTie&&!rHW&&!pTie&&!pHW);
  if(!ok)return 0;
  const mul=stageMul(group);
  if(rTie){return(pH===rH&&pA===rA?SCORING.correctDrawExact:SCORING.correctDrawOnly)*mul;}
  const wg=rHW?rH:rA,lg=rHW?rA:rH,pwg=pHW?pH:pA,plg=pHW?pA:pH;
  const gw=pwg===wg,gl=plg===lg;
  return(gw?SCORING.correctWinnerWinner:gl?SCORING.correctWinnerLoser:SCORING.correctWinner)*mul;
}
function isLocked(iso){if(!iso)return false;return new Date()>=new Date(new Date(iso).getTime()-60000);}
function countdown(iso){
  if(!iso)return null;
  const diff=new Date(new Date(iso).getTime()-60000)-new Date();
  if(diff<=0)return null;
  const h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
  if(h>48)return Math.floor(h/24)+"d "+h%24+"h";
  if(h>0)return h+"h "+m+"m";
  if(m>0)return m+"m "+s+"s";
  return s+"s";
}
function ptsBadge(pts){
  const[bg,col]=pts>=10?["#0e2a14","#5de890"]:pts>=6?["#2a1f00","#F0A500"]:pts>=3?["#0a1a2a","#3E94D4"]:["transparent","#555"];
  return `<span class="pts-badge" style="background:${bg};border:1px solid ${col}44;color:${col}">+${pts}pts</span>`;
}
function weatherHTML(w,lang){
  if(!w||w.temp==null)return "";
  const t=STRINGS[lang];
  return `<div class="weather-badge"><span>${WMO_ICONS[w.code]||"🌡️"}</span><span style="color:#E8EDF5;font-weight:600">${w.temp}°F</span><span style="color:#3A5A80">·</span><span style="color:#7A9CC0">${WMO_CODES[w.code]||""}</span><span style="color:#3A5A80">·</span><span style="color:#7A9CC0">${w.wind} ${t.wind}</span>${w.precip>15?`<span style="color:#3A5A80">·</span><span style="color:#3E94D4">${w.precip}%</span>`:""}</div>`;
}

// ── Fetch ────────────────────────────────────────────────────────────────────
async function loadFixtures(){
  const r=await fetch(PROXY);
  if(!r.ok)throw new Error("Proxy error "+r.status);
  const d=await r.json();
  return(d.matches||[]).map((m,i)=>({
    id:String(m.id||i),
    date:(m.utcDate||"").split("T")[0],
    kickoffISO:m.utcDate||"",
    time:m.utcDate?new Date(m.utcDate).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",timeZone:"America/New_York"}):"",
    home:m.homeTeam?.shortName||m.homeTeam?.name||"TBD",
    away:m.awayTeam?.shortName||m.awayTeam?.name||"TBD",
    homeCode:teamCode(m.homeTeam?.name),
    awayCode:teamCode(m.awayTeam?.name),
    venue:m.venue||"TBD",
    group:m.group||m.stage||"Group Stage",
    status:m.status||"TIMED"
  }));
}
async function loadWeather(venue,iso){
  const c=VENUE_COORDS[venue];if(!c||!iso)return null;
  const date=iso.split("T")[0];
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&hourly=temperature_2m,weathercode,windspeed_10m,precipitation_probability&timezone=${encodeURIComponent(c.tz)}&start_date=${date}&end_date=${date}`;
    const r=await fetch(url);const d=await r.json();
    const lh=parseInt(new Date(iso).toLocaleString("en-US",{timeZone:c.tz,hour:"2-digit",hour12:false}))||12;
    const idx=Math.min(lh,(d.hourly?.time?.length||1)-1);
    const tc=d.hourly?.temperature_2m?.[idx];
    return{temp:tc!=null?Math.round(tc*9/5+32):null,code:d.hourly?.weathercode?.[idx],wind:Math.round((d.hourly?.windspeed_10m?.[idx]||0)*0.621),precip:d.hourly?.precipitation_probability?.[idx]||0};
  }catch{return null;}
}
async function refreshData(){
  STATE.dataLoading=true;STATE.dataError="";render();
  try{
    let fm=SAMPLE_MATCHES;
    try{fm=await loadFixtures();}catch(e){STATE.dataError=e.message+" — using sample data.";fm=SAMPLE_MATCHES;}
    STATE.matches=fm;await store.set("wc-matches",fm);
    const wm={},now=new Date(),max=new Date(now.getTime()+15*24*3600000);
    const upcoming=fm.filter(m=>{if(!m.kickoffISO)return false;const k=new Date(m.kickoffISO);return k>=now&&k<=max;}).slice(0,12);
    for(const m of upcoming){const w=await loadWeather(m.venue,m.kickoffISO);if(w)wm[m.id]=w;await new Promise(r=>setTimeout(r,150));}
    STATE.weather=wm;await store.set("wc-weather",wm);
  }catch(e){STATE.dataError=String(e);}
  STATE.dataLoading=false;render();
}

// ── Scoring helpers ──────────────────────────────────────────────────────────
function matchById(){return Object.fromEntries(STATE.matches.map(m=>[m.id,m]));}
function totalPts(picks){const mb=matchById();return Object.entries(picks).reduce((s,[mid,p])=>s+calcPts(p,STATE.results[mid],mb[mid]?.group),0);}
function leaderboard(){
  return Object.entries(STATE.allPicks).map(([tm,picks])=>({tm,pts:totalPts(picks),n:Object.keys(picks).length})).sort((a,b)=>b.pts-a.pts);
}

// ── Countdown timers ─────────────────────────────────────────────────────────
let _timers=[];
function clearTimers(){_timers.forEach(clearInterval);_timers=[];}
function startTimers(){
  clearTimers();
  document.querySelectorAll("[data-countdown]").forEach(el=>{
    const iso=el.dataset.countdown;
    const update=()=>{const cd=countdown(iso);if(!cd){el.textContent="";el.style.display="none";}else el.textContent=cd+" "+t().toLock;};
    update();_timers.push(setInterval(update,1000));
  });
}

// ── Week grouping ─────────────────────────────────────────────────────────────
function groupByWeek(matches){
  const groups={};
  matches.forEach(m=>{
    if(!m.kickoffISO&&!m.date){const k="Unknown";(groups[k]=groups[k]||{label:"Unknown",key:"Unknown",matches:[]}).matches.push(m);return;}
    const d=new Date(m.kickoffISO||m.date+"T12:00:00Z");
    // Week number from June 11 (tournament start)
    const start=new Date("2026-06-11T00:00:00Z");
    const diffDays=Math.floor((d-start)/(86400000));
    const weekNum=Math.max(0,Math.floor(diffDays/7));
    const weekStart=new Date(start.getTime()+weekNum*7*86400000);
    const weekEnd=new Date(weekStart.getTime()+6*86400000);
    const fmt=dt=>dt.toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});
    const key="week-"+weekNum;
    const label=`Week ${weekNum+1}  ${fmt(weekStart)} – ${fmt(weekEnd)}`;
    if(!groups[key])groups[key]={label,key,weekNum,matches:[]};
    groups[key].matches.push(m);
  });
  return Object.values(groups).sort((a,b)=>a.weekNum-b.weekNum);
}

function weekNavHTML(weeks,activeWeek){
  return `<div class="week-nav">
    <div class="week-scroll" id="week-scroll">
      ${weeks.map(w=>`<button class="week-pill ${w.key===activeWeek?'active':'inactive'}" onclick="jumpToWeek('${w.key}')">${w.label}</button>`).join("")}
    </div>
  </div>`;
}

function weekMatchesHTML(weeks,renderCard){
  return weeks.map(w=>`
    <div id="${w.key}" style="scroll-margin-top:110px">
      <div class="week-header">
        <div class="week-header-line"></div>
        <div class="week-header-text">${w.label}</div>
        <div class="week-header-line" style="background:linear-gradient(90deg,transparent,#1A3560)"></div>
      </div>
      ${w.matches.map(renderCard).join("")}
    </div>`).join("");
}

function render(){
  const app=document.getElementById("app");
  const T=t();
  clearTimers();

  if(STATE.loading){app.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;min-height:100vh"><span style="color:#F0A500;font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:4px">${T.loading}...</span></div>`;return;}

  if(STATE.view==="entry"){renderEntry(app,T);return;}
  if(STATE.showApiConfig){renderApiConfig(app,T);return;}
  if(STATE.view==="admin"){renderAdmin(app,T);return;}
  renderParticipant(app,T);
}

          return `<div style="display:flex;justify-content:space-between;border-bottom:1px solid #1E3354;padding:4px 0">
            <span style="color:#3A5A80;font-size:.77rem">${flagImg(m.homeCode,true)} ${m.home} vs ${m.away} ${flagImg(m.awayCode,true)}</span>
            ${p?`<div style="display:flex;gap:7px;align-items:center"><span style="color:#7A9CC0;font-family:monospace;font-size:.82rem">${p.homeScore}–${p.awayScore}</span>${pts!==null?ptsBadge(pts):""}</div>`:`<span style="color:#1E3354;font-size:.77rem">—</span>`}
          </div>`;
        }).join("")}
      </div>`).join(""));
  } else {
    content=`<div class="section-title">${T.leaderboardTitle}</div>`+(board.map((e,i)=>`
      <div style="background:linear-gradient(135deg,#0F2847,#0D2040);border:1px solid #1A3560;border-radius:10px;padding:13px 18px;margin-bottom:7px;display:flex;align-items:center;gap:14px">
        <span style="color:${i===0?"#F0A500":i===1?"#bbb":i===2?"#cd7f32":"#3A5A80"};font-family:'Barlow Condensed',sans-serif;font-weight:700;width:32px;text-align:center">${i===0?"1st":i===1?"2nd":i===2?"3rd":"#"+(i+1)}</span>
        <div style="flex:1"><div style="color:#E8EDF5;font-weight:600;font-size:.9rem">${e.tm}</div><div style="color:#3A5A80;font-size:.7rem">${e.n} ${T.picks}</div></div>
        <div style="font-family:monospace;font-size:1.15rem;font-weight:700;color:#F0A500">${e.pts} ${T.pts}</div>
      </div>`).join("") || `<p style="color:#3A5A80">${T.noPicks}</p>`);
  }

  app.innerHTML=`
  <div style="min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#142e5e 0%,#0B1F3A 40%,#060E1F 100%);padding-bottom:60px">
    <div class="nav">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="nav-title" style="color:#F0A500">WC PICK'EM</span>
        <span class="nav-title" style="color:#fff">2026</span>
        <span style="background:#C8102E;color:#fff;font-size:.62rem;font-weight:700;border-radius:3px;padding:2px 7px;letter-spacing:1px">${T.commissioner}</span>
        ${langSwitch()}
      </div>
      <div style="display:flex;gap:7px">
        <button onclick="refreshData()" style="background:#1E3354;color:#F0A500;border:1px solid #1A3560;border-radius:6px;padding:5px 12px;font-size:.75rem;font-weight:600" ${STATE.dataLoading?"disabled":""}>
          <span style="display:inline-block;animation:${STATE.dataLoading?"spin 1s linear infinite":"none"}">↻</span> ${STATE.dataLoading?T.loading:T.refresh}
        </button>
        <button onclick="logout()" style="background:transparent;border:1px solid #1E3354;color:#3A5A80;border-radius:6px;padding:5px 12px;font-size:.75rem">${T.logout}</button>
      </div>
    </div>
    ${STATE.dataError?`<div style="background:#1a0812;border:1px solid #C8102E44;border-radius:8px;margin:12px 16px 0;padding:8px 14px;color:#ff9090;font-size:.78rem">${STATE.dataError}</div>`:""}
    <div style="max-width:900px;margin:0 auto;padding:20px 12px;position:relative;z-index:1">
      ${tabsHTML}${content}
    </div>
  </div>`;
  startTimers();
  if(STATE.adminTab==="results"&&!STATE.activeWeek)autoScrollToCurrentWeek();
}

function renderApiConfig(app,T){
  app.innerHTML=`
  <div style="min-height:100vh;background:radial-gradient(ellipse at 30% 0%,#142e5e,#060E1F);display:flex;align-items:center;justify-content:center;padding:24px">
    <div style="position:fixed;top:14px;right:18px;z-index:200">${langSwitch()}</div>
    <div style="background:#0D2040;border:1px solid #1A3560;border-radius:16px;padding:32px;width:100%;max-width:480px">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:#F0A500;letter-spacing:4px;margin-bottom:4px">${T.apiConfig}</div>
      <p style="color:#7A9CC0;font-size:.83rem;margin-bottom:24px">${T.apiTagline}</p>
      <div style="background:#0c2010;border:1px solid #1a4020;border-radius:8px;padding:10px 14px;margin-bottom:22px">
        <div style="color:#5de890;font-size:.78rem">${T.weatherNote}</div>
      </div>
      <button class="gold-btn" onclick="refreshData();STATE.showApiConfig=false;render()" style="margin-bottom:10px">${T.saveLoad}</button>
      <button class="ghost-btn" onclick="STATE.showApiConfig=false;render()">${T.skipSample}</button>
    </div>
  </div>`;
}

// ── Actions ──────────────────────────────────────────────────────────────────
function toggleLang(){STATE.lang=STATE.lang==="en"?"pt":"en";store.set("wc-lang",STATE.lang);render();}
function jumpToWeek(key){
  STATE.activeWeek=key;
  // Update pill highlights without full re-render
  document.querySelectorAll(".week-pill").forEach(b=>{
    const active=b.getAttribute("onclick").includes(`'${key}'`);
    b.className="week-pill "+(active?"active":"inactive");
  });
  // Scroll the week pill into view in the nav
  const activeBtn=document.querySelector(`.week-pill.active`);
  if(activeBtn)activeBtn.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
  // Scroll the page to the week section
  const target=document.getElementById(key);
  if(target)target.scrollIntoView({behavior:"smooth",block:"start"});
}

function tryJoin(){
  const team=document.getElementById("inp-team")?.value?.trim();
  const code=document.getElementById("inp-pass")?.value?.trim().toUpperCase();
  const err=document.getElementById("entry-err");
  const T=t();
  if(code!==PASS){err.innerHTML=`<div class="err">${T.incorrectPass}</div>`;return;}
  if(!team){err.innerHTML=`<div class="err">${T.enterTeam}</div>`;return;}
  STATE.teamName=team;STATE.view="participant";STATE.tab="picks";STATE.filter="upcoming";render();
}

function showAdminField(){
  document.getElementById("admin-section").innerHTML=`
    <input id="inp-admin" class="inp" type="password" placeholder="${t().adminPh}" style="margin-bottom:8px" onkeydown="if(event.key==='Enter')tryAdmin()">
    <button class="ghost-btn" style="background:#1E3354;color:#F0A500;border-color:#F0A50044;font-family:'Barlow Condensed',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:1px" onclick="tryAdmin()">${t().enterAdmin}</button>`;
}

function tryAdmin(){
  const code=document.getElementById("inp-admin")?.value?.trim().toUpperCase();
  const T=t();
  if(code!==ADMIN_PASS){document.getElementById("entry-err").innerHTML=`<div class="err">${T.wrongAdmin}</div>`;return;}
  STATE.view="admin";STATE.adminTab="results";render();
}

function logout(){STATE.view="entry";STATE.teamName="";render();}
function setTab(tab){STATE.tab=tab;STATE.activeWeek=null;render();}
function setFilter(f){STATE.filter=f;STATE.activeWeek=null;render();}
function setAdminTab(tab){STATE.adminTab=tab;STATE.activeWeek=null;render();}

function autoScrollToCurrentWeek(){
  // Find the week containing today or the first upcoming match
  const now=new Date();
  const upcoming=STATE.matches.find(m=>m.kickoffISO&&new Date(m.kickoffISO)>=now);
  if(!upcoming)return;
  const start=new Date("2026-06-11T00:00:00Z");
  const diffDays=Math.floor((new Date(upcoming.kickoffISO)-start)/86400000);
  const weekNum=Math.max(0,Math.floor(diffDays/7));
  const key="week-"+weekNum;
  const target=document.getElementById(key);
  if(target){
    setTimeout(()=>{
      target.scrollIntoView({behavior:"smooth",block:"start"});
      const btn=document.querySelector(`.week-pill[onclick*="'${key}'"]`);
      if(btn){
        document.querySelectorAll(".week-pill").forEach(b=>b.className="week-pill inactive");
        btn.className="week-pill active";
        btn.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
      }
    },120);
  }
}

function updatePick(mid){
  const hs=document.getElementById("hs-"+mid)?.value;
  const as=document.getElementById("as-"+mid)?.value;
  const btn=document.getElementById("lock-"+mid);
  if(btn){
    const ok=hs!==""&&as!=="";
    btn.style.background=ok?"linear-gradient(135deg,#C8102E,#9A0C23)":"#1E3354";
    btn.style.color=ok?"#fff":"#3A5A80";
    btn.style.opacity=ok?"1":"0.4";
  }
}

function lockPick(mid){
  const hs=document.getElementById("hs-"+mid)?.value;
  const as=document.getElementById("as-"+mid)?.value;
  if(hs===""||as==="")return;
  const pick={homeScore:parseInt(hs),awayScore:parseInt(as)};
  if(!STATE.allPicks[STATE.teamName])STATE.allPicks[STATE.teamName]={};
  STATE.allPicks[STATE.teamName][mid]=pick;
  store.set("wc-picks",STATE.allPicks);
  const btn=document.getElementById("lock-"+mid);
  if(btn){btn.textContent=t().saved;btn.style.background="#1a4a20";btn.style.color="#5de890";setTimeout(()=>{btn.textContent=t().update;btn.style.background="linear-gradient(135deg,#C8102E,#9A0C23)";btn.style.color="#fff";},2000);}
}

function saveResult(mid){
  const hInput=document.querySelector(`input[data-mid="${mid}"][data-side="home"]`);
  const aInput=document.querySelector(`input[data-mid="${mid}"][data-side="away"]`);
  if(!hInput||!aInput)return;
  STATE.results[mid]={homeScore:parseInt(hInput.value),awayScore:parseInt(aInput.value)};
  store.set("wc-results",STATE.results);
  render();
}

// ── Boot ─────────────────────────────────────────────────────────────────────
(async()=>{
  const[r,p,w,m,l]=await Promise.all([store.get("wc-results"),store.get("wc-picks"),store.get("wc-weather"),store.get("wc-matches"),store.get("wc-lang")]);
  if(r)STATE.results=r;
  if(p)STATE.allPicks=p;
  if(w)STATE.weather=w;
  if(m)STATE.matches=m;
  if(l)STATE.lang=l;
  STATE.loading=false;
  render();
  refreshData();
})();
</script>
</body>
</html>
